# ==============================================================================
# Nginx Reverse Proxy Configuration for rollup-app.eraconnect.net
# Place this file into /etc/nginx/conf.d/rollup-app.conf on your RHEL server
# ==============================================================================

# WebSocket connection mapping for Blazor Server / SignalR
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name rollup-app.eraconnect.net;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name rollup-app.eraconnect.net;

    # SSL Certificates (provisioned via: certbot --nginx -d rollup-app.eraconnect.net)
    ssl_certificate /etc/letsencrypt/live/rollup-app.eraconnect.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rollup-app.eraconnect.net/privkey.pem;

    # SSL hardening protocols & ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Maximum upload size for menu photos and branding logos
    client_max_body_size 25M;

    location / {
        # Proxy to RollUp container on port 5088
        proxy_pass http://127.0.0.1:5088;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # SignalR long-lived WebSocket timeout configuration
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        
        # Disable buffering for real-time order updates
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
